<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Care Insights — Oracle Health</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue:       #1358D0;
      --blue-dark:  #0D3F9E;
      --blue-light: #EEF3FF;
      --text:       #111827;
      --sub:        #6B7280;
      --muted:      #9CA3AF;
      --border:     #E5E7EB;
      --bg:         #F5F7FA;
      --red:        #DC2626;
      --red-bg:     #FEF2F2;
      --amber:      #D97706;
      --green:      #059669;
      --green-bg:   #ECFDF5;
      --green-bd:   #A7F3D0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 14px; background: var(--bg); color: var(--text); line-height: 1.5;
    }
    .app { max-width: 600px; margin: 0 auto; }

    /* Header */
    .header { display:flex; align-items:center; gap:10px; padding:13px 20px; background:var(--blue); color:#fff; }
    .header svg { width:22px; height:22px; flex-shrink:0; }
    .header-title { font-size:16px; font-weight:600; flex:1; }
    .header-pill { font-size:11px; font-weight:600; background:rgba(255,255,255,.2); padding:3px 8px; border-radius:10px; }

    /* Status */
    .status-bar { display:flex; align-items:center; gap:6px; padding:5px 20px; background:#fff; border-bottom:1px solid var(--border); font-size:12px; color:var(--sub); }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--muted); flex-shrink:0; }
    .dot.ok { background:var(--green); }
    .dot.err { background:var(--red); }
    .dot.spin { background:var(--amber); animation:blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* Patient */
    .patient { background:#fff; padding:14px 20px 12px; border-bottom:1px solid var(--border); }
    .patient-name { font-size:19px; font-weight:700; margin-bottom:3px; }
    .patient-name.empty { color:var(--muted); font-weight:400; font-size:14px; }
    .patient-meta { font-size:13px; color:var(--sub); }

    /* Section */
    .section { padding:14px 20px 0; }
    .section-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .section-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--sub); }
    .count-pill { font-size:11px; font-weight:600; color:#fff; background:var(--red); padding:2px 9px; border-radius:10px; }
    .count-pill.zero { background:var(--green); }

    /* EHR tabs */
    .ehr-card { background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:14px; }
    .tabs { display:flex; border-bottom:1px solid var(--border); }
    .tab {
      flex:1; padding:9px 4px; text-align:center; font-size:12px; font-weight:500;
      color:var(--sub); cursor:pointer; border-bottom:2px solid transparent;
      transition:color .1s, border-color .1s;
    }
    .tab.active { color:var(--blue); border-bottom-color:var(--blue); }
    .tab-panel { display:none; padding:0; }
    .tab-panel.active { display:block; }

    /* FHIR rows */
    .fhir-row {
      display:flex; align-items:flex-start; gap:10px;
      padding:10px 14px; border-bottom:1px solid #F9FAFB; font-size:13px;
    }
    .fhir-row:last-child { border-bottom:none; }
    .fhir-row.new-entry { background:#F0FDF4; animation:fadeIn .4s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
    .fhir-code { font-family:monospace; font-size:11px; color:var(--sub); flex-shrink:0; min-width:54px; margin-top:1px; }
    .fhir-body { flex:1; min-width:0; }
    .fhir-name { font-weight:500; }
    .fhir-sub { font-size:12px; color:var(--sub); }
    .fhir-status {
      font-size:10px; font-weight:600; padding:2px 6px; border-radius:4px;
      background:#F0FDF4; color:var(--green); flex-shrink:0;
    }
    .fhir-status.inactive { background:#F3F4F6; color:var(--muted); }
    .fhir-empty { padding:20px 14px; font-size:13px; color:var(--muted); text-align:center; }
    .fhir-loading { padding:16px 14px; font-size:12px; color:var(--muted); text-align:center; }

    /* Gap cards */
    .gap { background:#fff; border:1px solid var(--border); border-radius:10px; margin-bottom:10px; overflow:hidden; }
    .gap.is-accepted { border-color:var(--green-bd); }
    .gap.is-declined { opacity:.5; }
    .gap-top { display:flex; align-items:flex-start; gap:12px; padding:13px 16px 10px; }
    .pip { width:10px; height:10px; border-radius:50%; flex-shrink:0; margin-top:4px; }
    .pip-open { background:var(--red); }
    .pip-warn { background:var(--amber); }
    .gap-body { flex:1; }
    .gap-name { font-size:14px; font-weight:600; margin-bottom:2px; }
    .gap-sub { font-size:12px; color:var(--sub); margin-bottom:6px; }
    .chips { display:flex; flex-wrap:wrap; gap:5px; }
    .chip { font-size:11px; font-weight:500; padding:2px 7px; border-radius:4px; }
    .c-due { background:#FEF3C7; color:#92400E; }
    .c-icd { background:#F3F4F6; color:#374151; font-family:monospace; }
    .c-hed { background:var(--blue-light); color:var(--blue); }
    .c-ok  { background:var(--green-bg); color:var(--green); }
    .c-dec { background:var(--red-bg); color:var(--red); }

    .gap-actions { display:flex; gap:8px; padding:9px 16px; border-top:1px solid #F3F4F6; background:#FAFAFA; }
    .confirm-panel { display:none; padding:12px 16px; background:#F9FAFB; border-top:1px solid var(--border); }
    .confirm-panel.open { display:block; }
    .confirm-label { font-size:13px; color:var(--sub); margin-bottom:10px; line-height:1.5; }
    .confirm-label strong { color:var(--text); }
    .confirm-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .write-status { font-size:12px; color:var(--sub); display:none; }
    .write-status.show { display:inline; }
    .accepted-bar {
      display:none; align-items:center; gap:8px; padding:9px 16px;
      background:var(--green-bg); border-top:1px solid var(--green-bd);
      font-size:13px; font-weight:500; color:var(--green);
    }
    .accepted-bar.show { display:flex; }

    /* Buttons */
    .btn { display:inline-flex; align-items:center; gap:5px; padding:7px 14px; border-radius:7px; font-size:13px; font-weight:500; cursor:pointer; border:none; transition:background .1s; white-space:nowrap; }
    .btn:disabled { opacity:.5; cursor:default; }
    .btn-blue  { background:var(--blue);  color:#fff; } .btn-blue:hover  { background:var(--blue-dark); }
    .btn-green { background:var(--green); color:#fff; } .btn-green:hover { background:#047857; }
    .btn-ghost { background:#fff; color:#374151; border:1px solid var(--border); } .btn-ghost:hover { background:#F9FAFB; }
    .btn-danger{ background:#fff; color:var(--red); border:1px solid #FECACA; } .btn-danger:hover { background:var(--red-bg); }

    /* Loading / error */
    .loading { text-align:center; padding:60px 20px; color:var(--sub); }
    .spinner { display:inline-block; width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite; margin-bottom:14px; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .error-box { margin:20px; padding:14px 16px; background:var(--red-bg); border:1px solid #FECACA; border-radius:8px; font-size:13px; color:var(--red); }
    .footer { padding:12px 20px 24px; text-align:center; font-size:12px; color:var(--muted); }
    .footer a { color:var(--muted); text-decoration:none; }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="white"/></svg>
    <span class="header-title">Care Insights</span>
    <span class="header-pill">Optum · Oracle Health</span>
  </div>

  <div class="status-bar">
    <div class="dot spin" id="connDot"></div>
    <span id="connText">Loading patient…</span>
  </div>

  <div class="loading" id="loadingEl">
    <div class="spinner"></div>
    <div>Connecting to EHR…</div>
  </div>

  <div id="mainContent" style="display:none">

    <div class="patient">
      <div class="patient-name" id="ptName"></div>
      <div class="patient-meta" id="ptMeta"></div>
    </div>

    <!-- EHR Summary -->
    <div class="section">
      <div class="section-row">
        <span class="section-label">EHR Data — Cerner</span>
      </div>
      <div class="ehr-card">
        <div class="tabs">
          <div class="tab active" onclick="showTab('problems')">Problem List</div>
          <div class="tab" onclick="showTab('meds')">Medications</div>
          <div class="tab" onclick="showTab('encounters')">Encounters</div>
        </div>
        <div class="tab-panel active" id="tab-problems">
          <div class="fhir-loading">Loading…</div>
        </div>
        <div class="tab-panel" id="tab-meds">
          <div class="fhir-loading">Loading…</div>
        </div>
        <div class="tab-panel" id="tab-encounters">
          <div class="fhir-loading">Loading…</div>
        </div>
      </div>
    </div>

    <!-- Care Gaps -->
    <div class="section">
      <div class="section-row">
        <span class="section-label">Care Gaps — Optum</span>
        <span class="count-pill" id="gapCount"></span>
      </div>
      <div id="gapList"></div>
    </div>

    <div class="footer"><a href="#">Terms</a> · <a href="#">Privacy</a></div>
  </div>

  <div class="error-box" id="errorEl" style="display:none"></div>
</div>

<script src='./lib/js/fhir-client-v0.1.12.js'></script>
<script src='./lib/js/fhir-client-cerner-additions-1.0.0.js'></script>
<script>
var GAP_DEFS = {
  hba1c: { name:'HbA1c Poor Control',          sub:'Diabetes Care · CDC',     icd:'E11.65', icdDesc:'Type 2 diabetes mellitus with hyperglycemia',                        pip:'pip-open', dueTxt:'Overdue' },
  col:   { name:'Colorectal Cancer Screening',  sub:'Preventive Care · COL-E', icd:'Z12.11', icdDesc:'Encounter for screening for malignant neoplasm of colon',            pip:'pip-open', dueTxt:'Overdue' },
  bcs:   { name:'Breast Cancer Screening',      sub:'Preventive Care · BCS-E', icd:'Z12.31', icdDesc:'Encounter for screening mammogram for malignant neoplasm of breast', pip:'pip-warn', dueTxt:'Due in 90 days' },
  cbp:   { name:'Blood Pressure Control',       sub:'Hypertension · CBP',      icd:'I10',    icdDesc:'Essential (primary) hypertension',                                   pip:'pip-warn', dueTxt:'Due in 90 days' },
  eed:   { name:'Diabetic Eye Exam',            sub:'Diabetes Care · EED',     icd:'Z01.00', icdDesc:'Encounter for examination of eyes and vision',                       pip:'pip-open', dueTxt:'Overdue' },
  ked:   { name:'Kidney Health Evaluation',     sub:'Diabetes Care · KED',     icd:'N18.9',  icdDesc:'Chronic kidney disease, unspecified',                                pip:'pip-open', dueTxt:'Overdue' },
  dep:   { name:'Depression Screening (PHQ-9)', sub:'Behavioral Health · DEP', icd:'Z13.31', icdDesc:'Encounter for screening for depression',                             pip:'pip-warn', dueTxt:'Due this visit' },
};
var GAP_PROFILES = [
  ['hba1c','col','eed'],
  ['bcs',  'cbp','col'],
  ['hba1c','bcs','cbp'],
  ['col',  'eed','ked'],
  ['hba1c','ked','dep'],
];
function hashId(id) {
  var h=0; for(var i=0;i<String(id).length;i++) h=(h*31+String(id).charCodeAt(i))&0xffff; return h;
}
function getGaps(patientId) {
  return GAP_PROFILES[hashId(patientId)%GAP_PROFILES.length].map(function(k){ return Object.assign({id:k},GAP_DEFS[k]); });
}

var _smart=null, _patientId=null, _gapStates={}, _currentGaps=[];
var _activeTab = 'problems';

// ── Utilities ─────────────────────────────────────────────────────────────────
function setConn(t,txt){ document.getElementById('connDot').className='dot '+(t==='ok'?'ok':t==='err'?'err':'spin'); document.getElementById('connText').textContent=txt; }
function showError(m){ document.getElementById('loadingEl').style.display='none'; var e=document.getElementById('errorEl'); e.textContent='Error: '+m; e.style.display='block'; setConn('err','Connection failed'); }
function fmtDob(s){ if(!s)return null; var p=s.split('-'); var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return m[+p[1]-1]+' '+(+p[2])+', '+p[0]; }
function calcAge(s){ if(!s)return null; var b=new Date(s),n=new Date(),a=n.getFullYear()-b.getFullYear(); if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--; return a; }

function fhirGet(path) {
  return fetch(_smart.server.serviceUrl+path, {
    headers:{ 'Authorization':'Bearer '+_smart.tokenResponse.access_token, 'Accept':'application/fhir+json' }
  }).then(function(r){ return r.json(); });
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function showTab(name) {
  _activeTab = name;
  document.querySelectorAll('.tab').forEach(function(t,i){
    var names=['problems','meds','encounters'];
    t.className = 'tab'+(names[i]===name?' active':'');
  });
  document.querySelectorAll('.tab-panel').forEach(function(p,i){
    var names=['problems','meds','encounters'];
    p.className = 'tab-panel'+(names[i]===name?' active':'');
  });
}

// ── Render patient ────────────────────────────────────────────────────────────
function renderPatient(pt) {
  var name='';
  if(pt.name&&pt.name[0]){ name=[(pt.name[0].given||[]).join(' '),pt.name[0].family].filter(Boolean).join(' '); }
  document.getElementById('ptName').textContent = name||'Unknown';
  document.getElementById('ptMeta').textContent =
    [fmtDob(pt.birthDate), calcAge(pt.birthDate)&&calcAge(pt.birthDate)+' yo',
     pt.gender&&pt.gender.charAt(0).toUpperCase()+pt.gender.slice(1)].filter(Boolean).join(' · ');
}

// ── Render EHR data ───────────────────────────────────────────────────────────
function renderConditions(bundle, highlightNewIcd) {
  var panel = document.getElementById('tab-problems');
  var entries = (bundle.entry||[]).map(function(e){ return e.resource; });
  if(!entries.length){ panel.innerHTML='<div class="fhir-empty">No conditions on record</div>'; return; }

  entries.sort(function(a,b){
    var av = a.clinicalStatus&&a.clinicalStatus.coding&&a.clinicalStatus.coding[0]&&a.clinicalStatus.coding[0].code==='active'?0:1;
    var bv = b.clinicalStatus&&b.clinicalStatus.coding&&b.clinicalStatus.coding[0]&&b.clinicalStatus.coding[0].code==='active'?0:1;
    return av-bv;
  });

  panel.innerHTML = entries.map(function(c){
    var coding = c.code&&c.code.coding&&c.code.coding[0];
    var code = coding&&coding.code||'—';
    var display = (c.code&&c.code.text)||coding&&coding.display||'Unknown';
    var status = c.clinicalStatus&&c.clinicalStatus.coding&&c.clinicalStatus.coding[0]&&c.clinicalStatus.coding[0].code||'unknown';
    var isNew = highlightNewIcd && code===highlightNewIcd;
    return '<div class="fhir-row'+(isNew?' new-entry':'')+'">' +
      '<div class="fhir-code">'+code+'</div>' +
      '<div class="fhir-body"><div class="fhir-name">'+(isNew?'<strong>'+display+'</strong>':display)+'</div>' +
      (isNew?'<div class="fhir-sub" style="color:var(--green)">Just added by Care Insights</div>':'') +
      '</div>' +
      '<div class="fhir-status'+(status!=='active'?' inactive':'')+'">'+status+'</div>' +
    '</div>';
  }).join('');
}

function renderMedications(bundle) {
  var panel = document.getElementById('tab-meds');
  var entries = (bundle.entry||[]).map(function(e){ return e.resource; });
  if(!entries.length){ panel.innerHTML='<div class="fhir-empty">No active medications on record</div>'; return; }
  panel.innerHTML = entries.map(function(m){
    var display = (m.medicationCodeableConcept&&(m.medicationCodeableConcept.text||m.medicationCodeableConcept.coding&&m.medicationCodeableConcept.coding[0]&&m.medicationCodeableConcept.coding[0].display))||'Unknown medication';
    var status = m.status||'unknown';
    var sig = m.dosageInstruction&&m.dosageInstruction[0]&&m.dosageInstruction[0].text||'';
    return '<div class="fhir-row">' +
      '<div class="fhir-body"><div class="fhir-name">'+display+'</div>'+(sig?'<div class="fhir-sub">'+sig+'</div>':'')+'</div>' +
      '<div class="fhir-status'+(status!=='active'?' inactive':'')+'">'+status+'</div>' +
    '</div>';
  }).join('');
}

function renderEncounters(bundle) {
  var panel = document.getElementById('tab-encounters');
  var entries = (bundle.entry||[]).map(function(e){ return e.resource; });
  if(!entries.length){ panel.innerHTML='<div class="fhir-empty">No encounters on record</div>'; return; }
  panel.innerHTML = entries.map(function(e){
    var type = e.type&&e.type[0]&&(e.type[0].text||e.type[0].coding&&e.type[0].coding[0]&&e.type[0].coding[0].display)||'Encounter';
    var date = e.period&&e.period.start ? new Date(e.period.start).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
    var status = e.status||'unknown';
    return '<div class="fhir-row">' +
      '<div class="fhir-body"><div class="fhir-name">'+type+'</div><div class="fhir-sub">'+date+'</div></div>' +
      '<div class="fhir-status'+(status==='finished'?' inactive':'')+'">'+status+'</div>' +
    '</div>';
  }).join('');
}

function loadEhrData(highlightIcd) {
  fhirGet('/Condition?patient='+_patientId+'&category=problem-list-item&_count=20')
    .then(function(b){ renderConditions(b, highlightIcd||null); })
    .catch(function(){ document.getElementById('tab-problems').innerHTML='<div class="fhir-empty">Could not load conditions</div>'; });

  fhirGet('/MedicationRequest?patient='+_patientId+'&status=active&_count=10')
    .then(function(b){ renderMedications(b); })
    .catch(function(){ document.getElementById('tab-meds').innerHTML='<div class="fhir-empty">Could not load medications</div>'; });

  fhirGet('/Encounter?patient='+_patientId+'&_sort=-date&_count=5')
    .then(function(b){ renderEncounters(b); })
    .catch(function(){ document.getElementById('tab-encounters').innerHTML='<div class="fhir-empty">Could not load encounters</div>'; });
}

// ── Gap rendering ─────────────────────────────────────────────────────────────
function updateCountBadge() {
  var n=_currentGaps.filter(function(g){ return _gapStates[g.id]==='open'; }).length;
  var el=document.getElementById('gapCount');
  el.textContent=n+' open'; el.className='count-pill'+(n===0?' zero':'');
}

function buildCard(gap) {
  var s=_gapStates[gap.id];
  var chips = s==='accepted' ? '<span class="chip c-ok">✓ Added to Problem List</span>'
             : s==='declined' ? '<span class="chip c-dec">Declined</span>'
             : '<span class="chip c-due">'+gap.dueTxt+'</span><span class="chip c-icd">'+gap.icd+'</span><span class="chip c-hed">HEDIS 2026</span>';
  var actions = (s!=='accepted'&&s!=='declined')
    ? '<div class="gap-actions"><button class="btn btn-blue" onclick="startAccept(\''+gap.id+'\')">Accept</button><button class="btn btn-danger" onclick="declineGap(\''+gap.id+'\')">Decline</button></div>' : '';
  var el=document.createElement('div');
  el.id='gap-'+gap.id;
  el.className='gap'+(s==='accepted'?' is-accepted':s==='declined'?' is-declined':'');
  el.innerHTML=
    '<div class="gap-top"><div class="pip '+gap.pip+'"></div><div class="gap-body">'+
      '<div class="gap-name">'+gap.name+'</div><div class="gap-sub">'+gap.sub+'</div>'+
      '<div class="chips" id="chips-'+gap.id+'">'+chips+'</div></div></div>'+
    '<div class="confirm-panel" id="confirm-'+gap.id+'">'+
      '<div class="confirm-label">Add <strong>'+gap.icd+'</strong> — '+gap.icdDesc+' to this patient\'s problem list?</div>'+
      '<div class="confirm-row">'+
        '<button class="btn btn-green" id="confirmBtn-'+gap.id+'" onclick="confirmAccept(\''+gap.id+'\')">✓ Confirm &amp; Write to Chart</button>'+
        '<button class="btn btn-ghost" onclick="cancelAccept(\''+gap.id+'\')">Cancel</button>'+
        '<span class="write-status" id="wst-'+gap.id+'"></span>'+
      '</div></div>'+
    '<div class="accepted-bar'+(s==='accepted'?' show':'')+'" id="accepted-'+gap.id+'">'+
      '<svg width="15" height="15" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="#059669"/><path d="M6 10l3 3 5-5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
      gap.icd+' written to Cerner problem list</div>'+
    actions;
  return el;
}

function renderGaps(patientId) {
  _currentGaps=getGaps(patientId);
  _currentGaps.forEach(function(g){ _gapStates[g.id]='open'; });
  var list=document.getElementById('gapList');
  list.innerHTML='';
  _currentGaps.forEach(function(g){ list.appendChild(buildCard(g)); });
  updateCountBadge();
}

// ── Gap interactions ──────────────────────────────────────────────────────────
function startAccept(id){ document.getElementById('confirm-'+id).classList.add('open'); }
function cancelAccept(id){ document.getElementById('confirm-'+id).classList.remove('open'); }

function confirmAccept(id) {
  var gap=_currentGaps.find(function(g){ return g.id===id; });
  var btn=document.getElementById('confirmBtn-'+id);
  var wst=document.getElementById('wst-'+id);
  btn.disabled=true; wst.textContent='Writing to Cerner…'; wst.className='write-status show';

  fetch(_smart.server.serviceUrl+'/Condition', {
    method:'POST',
    headers:{ 'Authorization':'Bearer '+_smart.tokenResponse.access_token, 'Content-Type':'application/fhir+json', 'Accept':'application/fhir+json' },
    body:JSON.stringify({
      resourceType:'Condition',
      clinicalStatus:{ coding:[{system:'http://terminology.hl7.org/CodeSystem/condition-clinical',code:'active'}] },
      verificationStatus:{ coding:[{system:'http://terminology.hl7.org/CodeSystem/condition-ver-status',code:'confirmed'}] },
      category:[{ coding:[{system:'http://terminology.hl7.org/CodeSystem/condition-category',code:'problem-list-item',display:'Problem List Item'}] }],
      code:{ coding:[{system:'http://hl7.org/fhir/sid/icd-10-cm',code:gap.icd,display:gap.icdDesc}], text:gap.icdDesc },
      subject:{ reference:'Patient/'+_patientId }
    })
  })
  .then(function(res){
    var ok=res.ok, st=res.status, loc=res.headers.get('location')||res.headers.get('Location')||'';
    return res.text().then(function(t){ var d=null; try{if(t)d=JSON.parse(t);}catch(e){} return {ok:ok,st:st,d:d,loc:loc}; });
  })
  .then(function(r){
    if(r.ok){
      _gapStates[id]='accepted';
      var card=document.getElementById('gap-'+id);
      card.className='gap is-accepted';
      document.getElementById('confirm-'+id).style.display='none';
      document.getElementById('chips-'+id).innerHTML='<span class="chip c-ok">✓ Added to Problem List</span>';
      document.getElementById('accepted-'+id).classList.add('show');
      var acts=card.querySelector('.gap-actions'); if(acts)acts.remove();
      updateCountBadge();
      // Switch to Problems tab and reload with highlight
      showTab('problems');
      document.getElementById('tab-problems').innerHTML='<div class="fhir-loading">Refreshing problem list…</div>';
      setTimeout(function(){ loadEhrData(gap.icd); }, 800);
    } else {
      var msg=(r.d&&r.d.issue&&r.d.issue[0]&&r.d.issue[0].diagnostics)||('HTTP '+r.st);
      btn.disabled=false; wst.textContent='Failed: '+msg;
    }
  })
  .catch(function(err){ btn.disabled=false; wst.textContent='Error: '+err.message; });
}

function declineGap(id) {
  _gapStates[id]='declined';
  var card=document.getElementById('gap-'+id);
  card.className='gap is-declined';
  document.getElementById('chips-'+id).innerHTML='<span class="chip c-dec">Declined</span>';
  var acts=card.querySelector('.gap-actions'); if(acts)acts.remove();
  updateCountBadge();
}

// ── SMART init ────────────────────────────────────────────────────────────────
FHIR.oauth2.ready(function(smart) {
  _smart=smart;
  smart.patient.read().then(function(patient) {
    _patientId=patient.id;
    document.getElementById('loadingEl').style.display='none';
    document.getElementById('mainContent').style.display='block';
    renderPatient(patient);
    renderGaps(patient.id);
    loadEhrData(null);
    setConn('ok','Connected · '+smart.server.serviceUrl.replace('https://',''));
  }).catch(function(err){ showError('Could not read patient: '+(err.message||err)); });
}, function(err){ showError(err.message||JSON.stringify(err)); });
</script>
